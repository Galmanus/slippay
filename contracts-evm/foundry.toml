[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[lint]
# owner()/usdc()/identity() are public API getters (Ownable-style names), not constants.
# asm-keccak256: readable keccak over inline assembly; the saving is ~100 gas (< $0.000002 on Arc).
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]
